<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дозор</title>
<meta name="description" content="Пошаговая тактика: враги заранее показывают удар, а три хранителя толкают их так, чтобы деревня уцелела.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Дозор</h1>
  <div class="isle" id="isle"></div>
  <div class="lanterns" id="lanterns" role="img"></div>
  <div class="top-tools">
    <button type="button" class="tool" id="btn-help" aria-label="Правила">?</button>
    <button type="button" class="tool" id="btn-sound" aria-label="Звук">♪</button>
    <span id="lang-slot"></span>
  </div>
</header>
<main class="layout">
  <div class="board-wrap" id="board-wrap">
    <canvas id="board" aria-label="Поле боя"></canvas>
    <div class="banner" id="banner"></div>
  </div>
  <aside class="side">
    <div class="status">
      <div class="turn" id="turn"></div>
      <div class="objective" id="objective"></div>
    </div>
    <div class="heroes" id="heroes"></div>
    <div class="info" id="info"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="btn-undo">Отменить шаг</button>
      <button type="button" class="btn ghost" id="btn-reset">Заново ход</button>
      <button type="button" class="btn main" id="btn-end">Конец хода</button>
    </div>
  </aside>
</main>
<div class="overlay" id="overlay" hidden><div class="card" id="ov-card" role="dialog" aria-modal="true"></div></div>
<script src="../i18n.js"></script>
<script src="lang.js"></script>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
