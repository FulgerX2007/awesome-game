# Publishes the Docker image to GitHub Container Registry when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Image: ghcr.io/<owner>/<repo>, tags 1.0.0, 1.0, 1 and latest (latest only for non-pre-releases).
name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Godot runs the tests of the Godot games (godot/deep, godot/pins) and the parity test against web/deep.
      - name: Install Godot
        run: |
          curl -sSfLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: $GODOT --headless --path godot/deep --import
      - run: $GODOT --headless --path godot/deep -s res://tests/run.gd
      # Тяни штифт on Godot: every level replayed with real physics (about a minute and a half).
      - run: $GODOT --headless --path godot/pins --import
      - run: $GODOT --headless --fixed-fps 60 --path godot/pins -s res://tests/levels.gd
      - run: node --test 'tests/**/*.test.js'

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase; the repository owner here is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=awesome-game
            org.opencontainers.image.description=Browser games served by a small Go server

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
